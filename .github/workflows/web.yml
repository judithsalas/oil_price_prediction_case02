# Mantiene al día la web de la previsión (Vercel) y los modelos (Hugging Face).
# - En cada push a main: publica la web con el código nuevo.
# - Cada día laborable: descarga datos, recalcula la previsión y publica la web.
# - El día 1 de cada mes (o a mano, marcando "reentrenar"): además reentrena.
# La web estática va a Vercel. Los modelos solo están en Hugging Face, no en git:
# - los del estudio (final/) los baja de allí scripts/exportar_web.py;
# - los reentrenados (app/) se recuperan y se vuelven a subir en cada ejecución,
#   junto con la ficha (models/README.md).
# Necesita los secretos VERCEL_TOKEN y HF_TOKEN (token de escritura).
name: Web y modelos

on:
  push:
    branches: [main]          # sin filtro de rutas: casi todo el repositorio acaba en la web
  schedule:
    - cron: '0 7 * * 1-5'     # días laborables, 07:00 UTC
    - cron: '0 8 1 * *'       # día 1 de cada mes: reentrenar
  workflow_dispatch:
    inputs:
      reentrenar:
        description: 'Reentrenar los modelos antes de calcular'
        type: boolean
        default: false

env:
  MODELOS_HF: judithsalas/prevision-brent      # repositorio de modelos en Hugging Face (el de URL en scripts/descargar_modelos.py)
  PROYECTO_VERCEL: prevision-brent             # nombre del proyecto en Vercel

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: web          # nunca dos ejecuciones a la vez
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Dependencias
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r app/requirements.txt huggingface_hub

      - name: Recuperar los modelos reentrenados de Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf download "$MODELOS_HF" --include "app/*" --local-dir models || true

      - name: Generar la web
        run: |
          if [ "${{ github.event.schedule }}" = '0 8 1 * *' ] || [ "${{ inputs.reentrenar }}" = 'true' ]; then
            python -m scripts.exportar_web --reentrenar
          else
            python -m scripts.exportar_web
          fi

      - name: Publicar la web en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "Falta el secreto VERCEL_TOKEN"; exit 1; }
          # La carpeta se llama como el proyecto y está fuera del repositorio: así
          # Vercel encuentra el proyecto por su nombre (y lo crea si no existe).
          cp -r web "$RUNNER_TEMP/$PROYECTO_VERCEL"
          npx --yes vercel@66.2.0 deploy --prod --yes --cwd "$RUNNER_TEMP/$PROYECTO_VERCEL"

      # final/ no se sube desde aquí: los modelos del estudio se publican a mano (ver README)
      - name: Subir a Hugging Face la ficha y los modelos reentrenados
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf upload "$MODELOS_HF" models . --exclude "final/*" --commit-message "Modelos del $(date -u +%F)"
