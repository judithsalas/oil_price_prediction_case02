version = "0.1.0"
description = "Educational machine learning case study on oil price prediction using RNN, LSTM, and GRU, including data collection and supporting resources."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "yfinance (>=1.8.0,<2.0.0)",
    "torch (>=2.15.0,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "streamlit (>=1.67.0,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false
