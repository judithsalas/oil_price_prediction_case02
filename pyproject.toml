[project]
name = "aa-case-02-oil-price-prediction"
version = "0.1.0"
description = "Educational machine learning case study on oil price prediction using RNN, LSTM, and GRU, including data collection and supporting resources."
authors = [
    {name = "Judith Salas"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "yfinance (>=1.8.0,<2.0.0)",
    "torch (>=2.15.0,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "fastapi (>=0.163.1,<0.164.0)",
    "uvicorn (>=0.54.0,<0.55.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
packages = [{include = "petroleo"}]
